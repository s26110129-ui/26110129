<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 朋友對我的動態留言板 ✨</title>
  
  <!-- 引入 Google 可愛圓潤字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. 全局變數與可愛風主題設定
       ========================================== */
    :root {
      --bg-color: #fff9fb;
      --primary: #ff6b8b;
      --primary-hover: #ff4770;
      --secondary: #ffd166;
      --accent: #4ecdc4;
      --text-dark: #4a4e69;
      --card-shadow: 0 10px 25px rgba(255, 107, 139, 0.12);
      --font-family: 'Zen Maru Gothic', 'Fredoka', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 2.5rem 1rem;
      position: relative;
      overflow-x: hidden;
      /* 可愛粉嫩點點背景 */
      background-image: 
        radial-gradient(#ffccd5 18%, transparent 19%),
        radial-gradient(#b8c0ff 18%, transparent 19%);
      background-size: 50px 50px;
      background-position: 0 0, 25px 25px;
    }

    /* 漂浮動態氣球 */
    .balloon {
      position: fixed;
      border-radius: 50%;
      opacity: 0.35;
      animation: float 10s infinite ease-in-out;
      pointer-events: none;
      z-index: 0;
    }
    .balloon:nth-child(1) { width: 100px; height: 100px; background: #ffb3c1; top: 12%; left: 6%; animation-delay: 0s; }
    .balloon:nth-child(2) { width: 70px; height: 70px; background: #b8c0ff; top: 65%; left: 88%; animation-delay: -3s; }
    .balloon:nth-child(3) { width: 90px; height: 90px; background: #ffd166; top: 78%; left: 8%; animation-delay: -6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(8deg); }
    }

    /* ==========================================
       2. 頁首標題區塊
       ========================================== */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--primary);
      display: inline-block;
      padding: 0.6rem 2rem;
      background: #ffffff;
      border-radius: 50px;
      border: 3px dashed var(--primary);
      box-shadow: 0 8px 20px rgba(255, 107, 139, 0.15);
      letter-spacing: 1px;
    }

    header p {
      margin-top: 0.8rem;
      font-size: 1.05rem;
      color: #7d8597;
    }

    .badge {
      display: inline-block;
      margin-top: 0.8rem;
      background: linear-gradient(135deg, var(--secondary), #ffb703);
      color: #fff;
      font-weight: 700;
      padding: 0.3rem 1.2rem;
      border-radius: 20px;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(255, 183, 3, 0.3);
    }

    /* ==========================================
       3. 酷炫『讀取留言中...』動畫
       ========================================== */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 1rem;
      position: relative;
      z-index: 1;
    }

    .loader-box {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 6px solid #ffe5ec;
      border-top: 6px solid var(--primary);
      border-right: 6px solid var(--accent);
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    .loader-icon {
      font-size: 2.5rem;
      animation: bounce 0.8s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0% { transform: scale(0.85) translateY(0); }
      100% { transform: scale(1.15) translateY(-6px); }
    }

    .loading-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 2px;
      animation: pulseText 1.5s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.6; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    /* ==========================================
       4. 瀑布流 Layout (Masonry Layout)
       ========================================== */
    .masonry-container {
      column-count: 3;
      column-gap: 1.5rem;
      max-width: 1150px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      display: none; /* 讀取完成後才會顯示 */
    }

    /* 響應式斷點設定 */
    @media (max-width: 900px) {
      .masonry-container { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-container { column-count: 1; }
    }

    /* 留言卡片樣式 */
    .card {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      background: #ffffff;
      border-radius: 22px;
      padding: 1.4rem;
      box-shadow: var(--card-shadow);
      border: 3px solid #ffffff;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px) rotate(1deg);
      box-shadow: 0 16px 32px rgba(255, 107, 139, 0.22);
    }

    /* 卡片可愛貼紙裝飾 */
    .card::after {
      content: '✨';
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 1.1rem;
      opacity: 0.6;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      border-bottom: 2px dashed rgba(0,0,0,0.06);
      padding-bottom: 0.6rem;
    }

    .author-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
    }

    .author-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-dark);
    }

    .whisper-tag {
      font-size: 0.72rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-weight: 700;
      background: #f0e6ff;
      color: #8338ec;
    }

    .card-body {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #333333;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 0.8rem;
    }

    .card-footer {
      font-size: 0.78rem;
      color: #a0aab2;
      text-align: right;
    }

    /* 錯誤提醒樣式 */
    .error-box {
      text-align: center;
      background: #fff0f0;
      color: #e63946;
      padding: 1.2rem;
      border-radius: 16px;
      border: 2px solid #ffb4b4;
      max-width: 480px;
      margin: 2rem auto;
    }

    /* 點擊爆發愛心粒子特效 */
    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 1.4rem;
      animation: particleBurst 0.8s ease-out forwards;
    }

    @keyframes particleBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4);
      }
      50% {
        transform: translate(calc(-50% + var(--vx)), calc(-50% + var(--vy))) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--vx) * 1.4), calc(-50% + var(--vy) * 1.4 - 15px)) scale(0.7);
      }
    }
  </style>
</head>
<body>

  <!-- 背景漂浮氣球 -->
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>

  <!-- 頁頭區塊 -->
  <header>
    <h1>💌 朋友對我的動態留言板</h1>
    <p>溫柔與滿滿祝福的悄悄話牆，點擊卡片有小驚喜喔！</p>
    <div id="statsBadge" class="badge" style="display: none;">載入中...</div>
  </header>

  <!-- 酷炫『讀取留言中...』動畫 -->
  <div id="loading" class="loading-container">
    <div class="loader-box">
      <div class="loader-ring"></div>
      <div class="loader-icon">💖</div>
    </div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 留言卡片瀑布流牆 -->
  <main id="masonryContainer" class="masonry-container"></main>

  <script>
    // Google 試算表 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRztjuVHBEuufY8e1a0x4hxXY_SK4diBReBzxHbVjSnh85wR7H-qScvcrqHC39i6gIGNP2d0PPdGZlA/pub?output=csv';

    // 可愛風馬卡龍卡片背景色
    const softColors = [
      '#FFF0F5', '#F0F8FF', '#F5FFFA', '#FFFDE7',
      '#F3E5F5', '#E8F5E9', '#FFF3E0', '#E0F7FA'
    ];

    // 可愛頭像 Emoji
    const avatars = ['🐱', '🐰', '🐻', '🦊', '🐣', '🦄', '🐶', '🐼', '🐨', '🍓', '🌸', '🎀'];

    /**
     * CSV 解析器：可正確處理含雙引號與逗號 (Commas) 的留言內容
     */
    function parseCSV(text) {
      const result = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') {
            cur += '"';
            i++; // 跳過轉義引號
          } else {
            inQuotes = !inQuotes; // 切換雙引號包覆狀態
          }
        } else if (c === ',' && !inQuotes) {
          row.push(cur.trim());
          cur = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') {
            i++; // 處理 \r\n 換行
          }
          row.push(cur.trim());
          if (row.length > 1 || row[0] !== '') {
            result.push(row);
          }
          row = [];
          cur = '';
        } else {
          cur += c;
        }
      }

      if (cur || row.length > 0) {
        row.push(cur.trim());
        result.push(row);
      }

      return result;
    }

    /**
     * 時間格式化
     */
    function formatTime(timeStr) {
      if (!timeStr) return '';
      const date = new Date(timeStr);
      if (isNaN(date.getTime())) return timeStr; // 若非標準日期格式，直接返回原字串
      return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
    }

    /**
     * 讀取並動態生成卡片
     */
    async function fetchMessages() {
      const loadingEl = document.getElementById('loading');
      const containerEl = document.getElementById('masonryContainer');
      const statsBadgeEl = document.getElementById('statsBadge');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) {
          throw new Error(`連線失敗 (HTTP ${response.status})`);
        }

        const csvText = await response.text();
        const parsedRows = parseCSV(csvText);

        // 檢查是否有留言（扣除第 0 列標題列）
        if (parsedRows.length <= 1) {
          loadingEl.innerHTML = `<div class="error-box">目前還沒有任何留言喔！</div>`;
          return;
        }

        // 跳過標題列 (時間戳記, 名字, 悄悄話...)
        const dataRows = parsedRows.slice(1);

        // 整理留言資料結構
        const messages = dataRows.map(row => {
          // 清理可能包覆的外圍引號
          const clean = (str) => str ? str.replace(/^"|"$/g, '') : '';
          return {
            timestamp: clean(row[0]),
            name: clean(row[1]) || '匿名好友',
            content: clean(row[2]) || '（留下了滿滿的心意...）'
          };
        });

        // 動態生成卡片 DOM
        containerEl.innerHTML = '';
        messages.forEach((msg, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          
          // 隨機背景色與頭像
          const bg = softColors[index % softColors.length];
          const avatar = avatars[Math.floor(Math.random() * avatars.length)];
          card.style.backgroundColor = bg;

          card.innerHTML = `
            <div class="card-header">
              <div class="author-wrapper">
                <div class="avatar">${avatar}</div>
                <div class="author-name">${escapeHTML(msg.name)}</div>
              </div>
              <span class="whisper-tag">💌 悄悄話</span>
            </div>
            <div class="card-body">${escapeHTML(msg.content)}</div>
            <div class="card-footer">${formatTime(msg.timestamp)}</div>
          `;

          // 點擊卡片觸發爆發愛心特效
          card.addEventListener('click', (e) => popHearts(e));

          containerEl.appendChild(card);
        });

        // 隱藏 Loading，顯示瀑布流
        loadingEl.style.display = 'none';
        containerEl.style.display = 'block';

        // 顯示統計標籤
        statsBadgeEl.textContent = `共收到 ${messages.length} 則溫馨留言`;
        statsBadgeEl.style.display = 'inline-block';

      } catch (err) {
        console.error('Fetch 發生錯誤:', err);
        loadingEl.innerHTML = `
          <div class="error-box">
            😿 載入留言失敗囉！<br>
            <small>請確認網路連線或試算表公開權限設定。</small>
          </div>
        `;
      }
    }

    /**
     * 防止 XSS 攻擊
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /**
     * 卡片點擊爆發愛心粒子特效
     */
    function popHearts(e) {
      const items = ['💖', '✨', '🌸', '💕', '⭐', '🎈'];
      const count = 6;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'heart-particle';
        particle.textContent = items[Math.floor(Math.random() * items.length)];
        
        particle.style.left = `${e.clientX}px`;
        particle.style.top = `${e.clientY}px`;

        const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5);
        const speed = 35 + Math.random() * 55;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        particle.style.setProperty('--vx', `${vx}px`);
        particle.style.setProperty('--vy', `${vy}px`);

        document.body.appendChild(particle);

        setTimeout(() => particle.remove(), 800);
      }
    }

    // 頁面載入後自動啟動
    document.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
